name: Bug report
description: A dialog it missed or couldn't move, or something else that isn't working.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: The app with the dialog
      description: Its name and version, and whether the dialog was a sheet or its own window.
  - type: textarea
    id: details
    attributes:
      label: What Accessibility says about the dialog
      description: If you can, the window's Role, Subrole and Identifier from Accessibility Inspector. Please don't paste the paths of your folders; describe them instead, like "a folder on a network share".
  - type: input
    id: version
    attributes:
      label: Right Folder version
      description: Menu bar icon → About Right Folder.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
